[project]
name = "celine-legal"
version = "0.1.0"
description = "Legal documents of an energy-community platform: actor-free templates, the renderer, and the legal host that serves them"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "markdown>=3.7",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
legal-build = "celine.legal.build:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    # FastAPI's test client.
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celine"]

# The templates ship inside the package, where `celine.legal.build` looks first.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "celine/legal/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
