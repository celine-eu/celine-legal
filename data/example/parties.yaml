# An example deployment: every party is invented. The templates' tests render every
# template with these values, so a template that types a real actor name or reads a value
# no deployment supplies fails here, before any deployment sees it.
roles:
  platform_operator: example-platform
  dataspace: example-dataspace

parties:
  example-dataspace:
    name: "example-dataspace"
    short: "example-dataspace"
    kind: dataspace
    forum: {it: "Exampletown", en: "Exampletown"}

  example-dso:
    name: "Example Distribution Network Operator S.p.A."
    short: "Example DSO"
    kind: dso
    legal_form: "società per azioni"
    registered_office: "Via Esempio 1, 00100 Exampletown (EX)"
    country: {it: "Italia", en: "Italy"}
    tax_code: "00000000001"
    vat: "00000000001"
    pec: "dso@pec.example.org"
    privacy_contact: "privacy@dso.example.org"
    dpo: "dpo@dso.example.org"
    representative: "Ada Example"
    meter_export_format: "ExampleExport"

  example-platform:
    name: "Example Platform S.r.l."
    short: "Example Platform"
    term: "ExampleOps"   # the term the terms of use define for it
    kind: platform-operator
    legal_form: "società a responsabilità limitata"
    registered_office: "Via Piattaforma 2, 00100 Exampletown (EX)"
    operating_site: "Via Piattaforma 2, 00100 Exampletown (EX), Italia"
    city: "Exampletown"
    country: {it: "Italia", en: "Italy"}
    tax_code: "00000000002"
    vat: "00000000002"
    pec: "platform@pec.example.org"
    privacy_contact: "privacy@platform.example.org"
    dpo: "dpo@platform.example.org"
    representative: "Bob Example"
    website: "https://platform.example.org"
    forum: {it: "Exampletown", en: "Exampletown"}
    aliases: [ex-platform]

processing:
  - controller: example-rec
    processor: example-platform
    service: "community digital platform"
    agreement: example-rec/data-processing-agreement
  - controller: example-dso
    processor: example-platform
    service: "dataspace connector"
    agreement: example-dso/data-processing-agreement

hosting:
  - provider: "Example Cloud Ltd"
    role: sub-processor of example-platform
    location: "EU"
    service: "example platform hosting"

providers:
  hosting:
    name: "Example Cloud Ltd"
    brand: "Example Cloud"
    address: "1 Cloud Street, Cloudcity, Exampleland"
    city: {it: "Cloudcity", en: "Cloudcity"}
    country: {it: "Exampleland", en: "Exampleland"}
    sub_processor: true
    service: {it: "Ospitalità di esempio", en: "Example hosting"}
    region: eu
    dpa_service:
      rec: {en: "Hosting of the platform"}
      dso: {en: "Hosting of the node"}
  email:
    name: "Example Mail SA"
    location: "EU"
    sub_processor: true
    region: eu
    service: {it: "Invio di email", en: "Email delivery"}
    dpa_service:
      rec: {en: "Email delivery"}
  sms:
    name: "Example SMS SAS"
    address: "2 rue Exemple, Smsville, Exampleland"
    city: {it: "Smsville", en: "Smsville"}
    country: {it: "Exampleland", en: "Exampleland"}
    sub_processor: true
    service: {it: "Codici via SMS", en: "SMS codes"}
    region: eu
    # What may leave the EEA, and under which safeguard: listed in the DPA's Annex 3, the
    # sub-processor list and the privacy notice. Leave it out when nothing does.
    transfers:
      it: "accesso del supporto tecnico da fuori dello SEE, con le clausole contrattuali tipo della Commissione europea"
      en: "support access from outside the EEA, under the European Commission's standard contractual clauses"
    dpa_service:
      rec: {en: "SMS codes"}
  maps:
    name: "Example Maps Foundation"
    country: {it: "Regno Unito", en: "United Kingdom"}
    products: {it: "geocodifica, mappe", en: "geocoding, map tiles"}

project:
  name: "EXAMPLE"
  programme: "Example Programme"
  grant_agreement: "000000000"
