name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: The tag is the project's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n -E 's/^version = "([^"]+)"/\1/p' pyproject.toml)
          [ "${GITHUB_REF#refs/tags/}" = "v$version" ] || { echo "tag ${GITHUB_REF#refs/tags/} is not v$version"; exit 1; }
          grep -q "^## $version$" CHANGELOG.md || { echo "CHANGELOG.md has no ## $version"; exit 1; }

  # One generic image: `dev` from main, `<tag>` and `latest` from a tag. A deployment's data
  # is mounted at run time, never built in.
  docker:
    name: Build and push celine-legal
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag(s)
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "extra_tag=" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "extra_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/celine-legal
          docker build --build-arg LEGAL_REVISION=${{ github.sha }} -t $IMAGE:${{ steps.vars.outputs.tag }} .
          if [ -n "${{ steps.vars.outputs.extra_tag }}" ]; then
            docker tag $IMAGE:${{ steps.vars.outputs.tag }} $IMAGE:${{ steps.vars.outputs.extra_tag }}
          fi

      - name: Smoke test
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/celine-legal:${{ steps.vars.outputs.tag }}
          # No mode: the host must refuse to start.
          REV=${{ github.sha }}
          # No data: the host must refuse to start.
          ! docker run --rm "$IMAGE"
          id=$(docker run -d --read-only -p 127.0.0.1:8080:8080 -e LEGAL_REVISION=$REV \
            -e LEGAL_DATA=/app/data/example "$IMAGE")
          trap 'docker rm -f "$id" >/dev/null' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/draft/$REV/platform/current.json | grep -q '"valid": false'
          curl -fsSI http://127.0.0.1:8080/draft/$REV/ | grep -qi '^x-legal-mode: sample'
          # The root: nothing published in the example, so nothing to accept.
          curl -fsS http://127.0.0.1:8080/example-rec/current.json | grep -q '"pending"'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi '^x-legal-mode: final'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/draft/0000/)" = 404 ]

      - name: Push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/celine-legal
          docker push $IMAGE:${{ steps.vars.outputs.tag }}
          if [ -n "${{ steps.vars.outputs.extra_tag }}" ]; then
            docker push $IMAGE:${{ steps.vars.outputs.extra_tag }}
          fi
