version: "3"

# Development tasks. A deployment runs the image (see README.md); it needs none of these.

vars:
  IMAGE: '{{.IMAGE | default "ghcr.io/celine-eu/celine-legal"}}'
  DATA: '{{.DATA | default "data/example"}}'
  MODE: '{{.MODE | default "sample"}}'
  # The draft is served under /draft/<the data's commit>/; the root serves the published releases.
  REVISION:
    sh: git -C "{{.DATA | default "data/example"}}" rev-parse HEAD 2>/dev/null || printf '%040d' 0
  RELEASE: '{{.RELEASE | default ""}}'

tasks:
  test:
    desc: The tests
    cmds:
      - uv run pytest -q {{.CLI_ARGS}}

  render:
    desc: Lay out DATA (default the example) as the draft (MODE=sample, default) or the stable site (MODE=final) into build/<MODE>
    cmds:
      - uv run legal-build --data "{{.DATA}}" --mode "{{.MODE}}" --out "build/{{.MODE}}" {{.CLI_ARGS}}

  run:
    desc: The legal host over DATA on :8080 (the stable site at /, the draft at /draft/<REVISION>/), reloading on change
    env:
      LEGAL_DATA: '{{.DATA}}'
      LEGAL_REVISION: '{{.REVISION}}'
      LEGAL_RELEASE: '{{.RELEASE}}'
    cmds:
      - 'echo "  → stable http://127.0.0.1:8080/   draft http://127.0.0.1:8080/draft/{{.REVISION}}/"'
      - uv run uvicorn --factory celine.legal.app:create_app --port 8080 --reload --reload-dir src --reload-dir templates --reload-dir "{{.DATA}}"

  image:
    desc: Build the image as CI does, and smoke-test it on the example
    cmds:
      - docker build --build-arg LEGAL_REVISION=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -t "{{.IMAGE}}:local" .
      - |
        set -eu
        rev={{.REVISION}}
        id=$(docker run -d --read-only -p 127.0.0.1::8080 -e LEGAL_REVISION=$rev \
          -e LEGAL_DATA=/app/data/example "{{.IMAGE}}:local")
        trap 'docker rm -f "$id" >/dev/null' EXIT
        port=$(docker port "$id" 8080/tcp | head -1 | sed 's/.*://')
        for i in $(seq 1 30); do curl -fsS "http://127.0.0.1:$port/healthz" >/dev/null 2>&1 && break; sleep 0.5; done
        curl -fsS "http://127.0.0.1:$port/draft/$rev/platform/current.json" | grep -q '"valid": false'
        curl -fsS "http://127.0.0.1:$port/example-rec/current.json" | grep -q '"pending"'
        echo "  ok {{.IMAGE}}:local serves the example: the draft at /draft/$rev/, nothing stable yet at /"

  # **Releasing** (the maintainer commits, tags and pushes; these tasks never push):
  #   task release:version VERSION=0.2.0   set the version (pyproject, lock); add its CHANGELOG section
  #   task release:check VERSION=0.2.0     everything a release needs, before committing it
  #   git commit -am "0.2.0"
  #   task release:tag VERSION=0.2.0       the annotated tag v0.2.0, after the check passes on a clean tree
  #   git push origin main v0.2.0          GitHub Actions (release.yaml) tests, builds, smoke-tests and
  #                                        pushes ghcr.io/celine-eu/celine-legal:v0.2.0 and :latest
  release:version:
    desc: Set the project version to VERSION (pyproject.toml and uv.lock)
    requires:
      vars: [VERSION]
    preconditions:
      - sh: echo "{{.VERSION}}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
        msg: "VERSION={{.VERSION}}: X.Y.Z, without the v"
    cmds:
      - sed -i -E 's/^version = "[^"]+"/version = "{{.VERSION}}"/' pyproject.toml
      - uv lock --quiet
      - 'grep -q "^## {{.VERSION}}$" CHANGELOG.md || echo "  !! add a ## {{.VERSION}} section to CHANGELOG.md"'

  release:check:
    desc: Is VERSION ready to release? Version, changelog, tests, private names, image smoke test
    requires:
      vars: [VERSION]
    preconditions:
      - sh: grep -q '^version = "{{.VERSION}}"$' pyproject.toml
        msg: "pyproject.toml is not at {{.VERSION}}: task release:version VERSION={{.VERSION}}"
      - sh: grep -q "^## {{.VERSION}}$" CHANGELOG.md
        msg: "CHANGELOG.md has no ## {{.VERSION}} section"
      - sh: '! git rev-parse -q --verify "refs/tags/v{{.VERSION}}" >/dev/null'
        msg: "v{{.VERSION}} is already tagged"
    cmds:
      - task: test
      - task: check:private-names
      - task: image
      - echo "  ok {{.VERSION}} is ready; commit it, then task release:tag VERSION={{.VERSION}}"

  release:tag:
    desc: Tag the committed VERSION as vVERSION (annotated); prints the push command, never pushes
    requires:
      vars: [VERSION]
    preconditions:
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: "uncommitted changes: commit the release first"
      - sh: grep -q '^version = "{{.VERSION}}"$' pyproject.toml
        msg: "the committed pyproject.toml is not at {{.VERSION}}"
    cmds:
      - task: release:check
        vars: { VERSION: '{{.VERSION}}' }
      - git tag -a "v{{.VERSION}}" -m "celine-legal {{.VERSION}}"
      - 'echo "  tagged v{{.VERSION}}; publish it with: git push origin HEAD v{{.VERSION}}"'

  check:private-names:
    desc: No tracked file names a private organisation (list in .private-names or $LEGAL_PRIVATE_NAMES)
    cmds:
      - scripts/check-private-names.sh
